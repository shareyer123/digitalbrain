# Per-project enforcement level for the DevLog gate (devlog-watch.sh).
#
#   on  = a real event (commit, edit, declared decision/deploy/finding) BLOCKS the turn from
#         ending, ONCE, until the vault is written. Then it degrades to a warning.
#   off = warning only. Never interrupts.
#
# Start with `on` for everything: the block is one sentence, never a wedge, and it is the whole
# point. Flip to `off` only for a project where a false interruption is genuinely expensive.
# No restart needed; the hook reads this file on every turn.

DigitalBrain=on
